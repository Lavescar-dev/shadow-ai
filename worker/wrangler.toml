name = "nexus-ai-api"
main = "src/index.ts"
compatibility_date = "2026-04-01"
workers_dev = false
routes = [
  { pattern = "nexus.lavescar.com.tr/api/*", zone_name = "lavescar.com.tr" }
]

[vars]
PUBLIC_ORIGIN = "https://nexus.lavescar.com.tr"
API_PUBLIC_ORIGIN = "https://nexus.lavescar.com.tr"
ALLOWED_ORIGIN = "https://nexus.lavescar.com.tr,https://nexus-ai-h1u.pages.dev,http://127.0.0.1:5173"
GOOGLE_CLIENT_ID = "1038015047125-q9qfa0i9d67l9t8d9832j99m8tojftki.apps.googleusercontent.com"
GITHUB_CLIENT_ID = "Ov23liHvr1ZzwjkCqxOF"
OPENROUTER_HTTP_REFERER = "https://nexus.lavescar.com.tr"
OPENROUTER_DEFAULT_MODEL = "openai/gpt-oss-120b:free"
OPENROUTER_MODEL_CHAT = "openai/gpt-oss-120b:free"
OPENROUTER_MODEL_CONTENT = "qwen/qwen3-next-80b-a3b-instruct:free"
OPENROUTER_MODEL_CODE = "qwen/qwen3-coder:free"
OPENROUTER_MODEL_CANVAS = "qwen/qwen3-coder:free"
OPENROUTER_JSON_TIMEOUT_MS = "32000"
OPENROUTER_MODEL_EMAIL = "openai/gpt-oss-20b:free"
OPENROUTER_MODEL_VIDEO = "qwen/qwen3-next-80b-a3b-instruct:free"
OPENROUTER_MODEL_SEO = "z-ai/glm-4.5-air:free"
OPENROUTER_MODEL_IMAGE = "openai/gpt-oss-20b:free"
OPENROUTER_MODEL_VOICE = "openai/gpt-oss-20b:free"
OPENROUTER_MODEL_RESUME = "openai/gpt-oss-120b:free"
OPENROUTER_MODEL_BOT = "qwen/qwen3-next-80b-a3b-instruct:free"
CF_IMAGE_MODEL = "@cf/black-forest-labs/flux-1-schnell"
OPENROUTER_APP_TITLE = "Shadow AI"
EMBEDDING_MODEL = "@cf/baai/bge-small-en-v1.5"
IP_RATE_LIMIT_PER_MINUTE = "10"
USER_DAILY_MESSAGE_LIMIT = "50"
DAILY_CHAT_LIMIT = "50"
DAILY_MODE_LIMIT = "30"
DAILY_IMAGE_LIMIT = "6"
DAILY_PDF_LIMIT = "5"
REQUIRE_TURNSTILE = "false"
SUPPORT_EMAIL = "support@lavescar.com.tr"
CANVAS_BETA = "true"

[[d1_databases]]
binding = "DB"
database_name = "nexus_ai"
database_id = "490c93e5-0e1c-49e5-82de-0d74b77cc6ef"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "ff19ba62891c49c7b076fb6d9c0861a3"
preview_id = "e334652673ec42b39253d97c0e2d28ca"

[[vectorize]]
binding = "MEMORY_INDEX"
index_name = "nexus-ai-memory"

[ai]
binding = "AI"
